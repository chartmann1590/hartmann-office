name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Make a new spreadsheet
        2. Type =SUM(A1:A3) in A4
        3. …
  - type: dropdown
    id: kind
    attributes:
      label: Which editor?
      options: [Documents, Spreadsheets, Presentations, Files and library, PDF or printing, Other]
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Computer, Tablet, Phone]
  - type: input
    id: version
    attributes:
      label: Hartmann Office version
      placeholder: "1.1.0"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or files
      description: Attach a screenshot, or a small file that shows the problem. Leave out anything private.
